services:
  # Telegram-бот приёма заявок (существующий сервис, без изменений)
  bot:
    build: .
    restart: always
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMIN_CHAT_IDS=${ADMIN_CHAT_IDS}
      - REVIEW_CHAT_ID=${REVIEW_CHAT_ID}
    volumes:
      - bot-data:/app/data

  # Модуль мерч-кодов: генерация и проверка серийных номеров
  # (поддомен, например code.catalist.world — задаётся в .env)
  merch:
    build: ./merch
    restart: always
    environment:
      - MERCH_PRODUCTION_PIN=${MERCH_PRODUCTION_PIN}
      - MERCH_ADMIN_PIN=${MERCH_ADMIN_PIN}
      - MERCH_SERIAL_KEY=${MERCH_SERIAL_KEY:-}
      # публичный адрес для ссылок в письмах и QR; до настройки DNS можно
      # временно переопределить в .env: MERCH_PUBLIC_URL=http://IP:8080
      - MERCH_PUBLIC_URL=${MERCH_PUBLIC_URL:-https://${MERCH_DOMAIN:-code.catalist.world}}
      - MERCH_BEHIND_PROXY=1
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MERCH_ADMIN_EMAILS=${MERCH_ADMIN_EMAILS:-}
      - MERCH_SMTP_HOST=${MERCH_SMTP_HOST:-}
      - MERCH_SMTP_PORT=${MERCH_SMTP_PORT:-587}
      - MERCH_SMTP_USER=${MERCH_SMTP_USER:-}
      - MERCH_SMTP_PASSWORD=${MERCH_SMTP_PASSWORD:-}
      - MERCH_SMTP_FROM=${MERCH_SMTP_FROM:-}
      - MERCH_SMTP_SECURITY=${MERCH_SMTP_SECURITY:-starttls}
      - MERCH_DISCOUNT_PERCENT=${MERCH_DISCOUNT_PERCENT:-10}
    volumes:
      - merch-data:/app/data

  # Reverse-proxy с автоматическим HTTPS (Let's Encrypt) для поддомена
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      # временный доступ по IP до настройки DNS (см. deploy/Caddyfile);
      # после запуска https-адреса эту строку можно удалить
      - "8080:8080"
    environment:
      - MERCH_DOMAIN=${MERCH_DOMAIN:-code.catalist.world}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - merch

volumes:
  bot-data:
  merch-data:
  caddy-data:
  caddy-config:

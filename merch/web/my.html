<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalist — my collection</title>
<meta name="description" content="Your registered Catalist figurines and loyalty discounts.">
<meta name="robots" content="noindex">
<link rel="icon" href="/static/logo.png">
<link rel="stylesheet" href="/static/style.css">
<style>
  /* Кабинет живёт в собственных стилях: из style.css берутся только css-переменные
     (--page --ink --panel --line --steel --field --plate --green --oxide --brass).
     Аудитория — телефоны, поэтому всё крупное: текст от 16px, кнопки от 54px. */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: var(--sans);
    font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); }

  .topbar { position: static; background: var(--page); border-bottom: 1.5px solid var(--ink); padding: 14px 16px; }
  .topbar-in { max-width: 560px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .logo { display: flex; align-items: flex-end; gap: 12px; margin: 0; min-width: 0; }
  .logo img { height: 32px; width: auto; display: block; }
  .logo-sub { white-space: nowrap; line-height: 1; padding: 0 0 6px 12px; border-left: 1.5px solid var(--line); font-size: 11px; font-weight: 600; letter-spacing: 2.2px; text-transform: uppercase; color: var(--steel); }
  .top-link { color: var(--steel); font-size: 11px; font-weight: 600; letter-spacing: 1.8px; text-transform: uppercase; line-height: 1; text-decoration: none; white-space: nowrap; padding: 0 0 6px 12px; }
  .top-link:hover { color: var(--ink); }
  .top-link:hover, .top-link:active { text-decoration: underline; }

  .shell { max-width: 560px; width: 100%; margin: 0 auto; padding: 0 16px 72px; flex: 1; }

  h1 {
    font-family: var(--sans); font-weight: 300; font-size: clamp(30px, 8.5vw, 38px); line-height: 1.08;
    letter-spacing: .5px; text-transform: uppercase; color: var(--ink); margin: 36px 0 12px;
  }
  h1 b { font-family: var(--display); font-weight: 800; letter-spacing: .2px; }
  .spark { width: 22px; height: 22px; margin-left: 6px; vertical-align: baseline; transform: translateY(-12px); color: var(--ink); }

  .page-loading { margin-top: 64px; text-align: center; font-size: 15px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--steel); }

  .pcard { background: var(--panel); border-radius: 16px; padding: 24px 22px; margin-top: 20px; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
  .pcard > .pill:first-child { margin-top: 0; }
  .lead { font-size: 17px; line-height: 1.55; color: var(--ink); margin: 0; }

  label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--steel); margin: 20px 0 8px; }
  input {
    width: 100%; min-height: 54px; padding: 14px 22px;
    background: var(--field); color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 999px;
    font-family: inherit; font-size: 16px; font-weight: 500; appearance: none;
  }
  input:focus { outline: none; border-color: var(--ink); }
  input::placeholder { color: var(--steel); opacity: .7; }

  .pill {
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 54px; padding: 14px 24px; margin-top: 16px;
    border-radius: 999px; cursor: pointer; text-decoration: none; text-align: center;
    font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: .2px; text-transform: none;
    border: 1.5px solid var(--ink); transition: opacity .15s ease;
  }
  .pill-primary { background: var(--ink); color: #FFFFFF; }
  .pill-secondary { background: var(--panel); color: var(--ink); }
  .pill:hover { opacity: .88; }
  .pill:disabled { opacity: .5; cursor: default; }

  .or-line { text-align: center; font-size: 12px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; color: var(--steel); margin: 22px 0 6px; }

  .note { font-size: 15px; line-height: 1.55; margin-top: 14px; color: var(--steel); }
  .note.err { color: var(--oxide); font-weight: 600; }
  .note.okk { color: var(--green); font-weight: 600; }

  .session-row { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; margin: 0 0 4px; font-size: 15px; color: var(--steel); }
  .session-row .who b { color: var(--ink); font-weight: 700; word-break: break-all; }
  .linklike { border: none; background: none; padding: 8px 0; font-family: inherit; font-size: 15px; font-weight: 700; color: var(--ink); text-decoration: underline; cursor: pointer; }

  .fig-card { padding: 0; overflow: hidden; }
  .fig-photo { display: block; width: 100%; height: auto; }
  .fig-stub { width: 100%; aspect-ratio: 16 / 7; display: flex; align-items: center; justify-content: center; }
  .stub-logo { height: 46px; width: auto; filter: brightness(0) invert(1); opacity: .8; }
  .fig-body { padding: 20px 20px 24px; }
  .fig-name { font-family: var(--display); font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: .4px; line-height: 1.15; }
  .fig-color { display: flex; align-items: center; gap: 9px; margin-top: 10px; font-size: 15px; font-weight: 600; color: var(--steel); }
  .swatch2 { width: 16px; height: 16px; border-radius: 5px; border: 1px solid rgba(20,18,14,.25); flex: none; }
  .fig-rows { margin-top: 18px; }
  .kvr { display: flex; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 16px; }
  .kvr .k { color: var(--steel); font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; padding-top: 4px; flex: none; }
  .kvr .v { text-align: right; word-break: break-word; font-weight: 600; }
  .serial { letter-spacing: 2.5px; font-weight: 700; }

  .discount { margin-top: 20px; background: var(--plate); color: #FFFFFF; border-radius: 16px; padding: 20px 20px 24px; }
  .discount-head { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; }
  .discount-title { font-family: var(--display); font-size: 17px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; }
  .badge { display: inline-flex; align-items: center; padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
  .badge-active { background: var(--green); color: #FFFFFF; }
  .badge-used { background: var(--steel); color: #FFFFFF; }
  .qr-box { background: #FFFFFF; border-radius: 16px; padding: 12px; width: 100%; max-width: 284px; margin: 20px auto 0; }
  .qr-box img { display: block; margin: 0 auto; }
  .discount-used .qr-box { opacity: .4; }
  .discount-token { margin-top: 16px; text-align: center; font-family: var(--mono); font-size: 20px; font-weight: 700; letter-spacing: 3px; word-break: break-all; color: #FFFFFF; }
  .discount-note { margin-top: 10px; text-align: center; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,.75); }

</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="logo">
      <img src="/static/logo.png" alt="Catalist">
      <span class="logo-sub">My collection</span>
    </div>
    <a class="top-link" href="/">&larr; Serial check</a>
  </div>
</header>

<div class="shell">
  <main id="main" aria-live="polite">
    <div class="page-loading">Loading&hellip;</div>
  </main>
</div>

<footer class="site-foot">
  <div class="foot-inner">
    <div class="foot-top">
      <img class="foot-logo" src="/static/logo.png" alt="Catalist">
    </div>
    <nav class="foot-links">
      <a href="https://catalist.world">catalist.world</a>
      <a href="/">Serial check</a>
      <a href="/my">My collection</a>
    </nav>
    <div class="foot-copy">© 2026 Catalist · Special edition marking</div>
  </div>
</footer>

<script src="/static/my.js"></script>
</body>
</html>
